<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>회원가입 — WAYO</title>
    <meta name="description" content="WAYO에 가입하고 나만의 맞춤 여행지와 일정을 저장해보세요.">
    <meta name="theme-color" content="#FFC83D">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- 네비게이션 -->
    <!-- 네비게이션: 상단 골드 바 + 햄버거(좌) · 로고(중앙) · 검색/즐겨찾기/로그인(우) -->
    <div class="navbar-accent-bar"></div>
    <header class="navbar-wix" id="siteNavbar">
        <div class="navbar-wix-inner">
            <div class="navbar-wix-side">
                <button type="button" class="navbar-hamburger-btn" id="drawerToggleBtn" aria-label="메뉴 열기" aria-expanded="false">
                    <i data-lucide="menu" style="width:22px;height:22px"></i>
                </button>
            </div>

            <a href="index.html" class="navbar-wix-logo" aria-label="WAYO 홈으로 이동">
                <img src="assets/logo/g_logo_t_extrabold_final.png" alt="WAYO" class="navbar-wix-logo-img">
            </a>

            <div class="navbar-wix-side is-right">
                <div class="navbar-wix-right">
                    <div class="navbar-search-wrap">
                        <input type="text" class="navbar-search-input" id="navSearchInput" placeholder="검색어를 입력하세요">
                        <button type="button" class="navbar-search-btn" id="navSearchBtn" aria-label="검색">
                            <i data-lucide="search" style="width:16px;height:16px"></i>
                        </button>
                    </div>
                    <a href="favorites.html" class="navbar-wix-login-btn" aria-label="즐겨찾기">
                        <i data-lucide="heart" style="width:19px;height:19px"></i>
                    </a>
                    <a href="login.html" class="navbar-wix-login-btn js-login-trigger" aria-label="로그인">
                        <i data-lucide="user" style="width:19px;height:19px"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- 사이드 드로어 메뉴 (카테고리) -->
    <div class="wayo-drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="wayo-drawer" id="drawerPanel" aria-hidden="true">
        <div class="wayo-drawer-head">
            <img src="assets/logo/w3_logo_3_3_wayo_lockup_bottom.png" alt="WAYO" class="wayo-drawer-head-logo">
            <button type="button" class="wayo-drawer-close" id="drawerCloseBtn" aria-label="메뉴 닫기">
                <i data-lucide="x" style="width:20px;height:20px"></i>
            </button>
        </div>

        <div class="wayo-drawer-body">
            <p class="wayo-drawer-label">NAVIGATION</p>
            <nav class="wayo-drawer-nav">
                <a href="index.html" class="wayo-drawer-link">
                    <span class="wayo-drawer-link-main"><i data-lucide="home" style="width:18px;height:18px"></i> 홈</span>
                    <i data-lucide="chevron-right" style="width:16px;height:16px" class="wayo-drawer-chev"></i>
                </a>
                <a href="destination.html" class="wayo-drawer-link">
                    <span class="wayo-drawer-link-main"><i data-lucide="compass" style="width:18px;height:18px"></i> 여행지 추천</span>
                    <i data-lucide="chevron-right" style="width:16px;height:16px" class="wayo-drawer-chev"></i>
                </a>
                <a href="planner.html" class="wayo-drawer-link">
                    <span class="wayo-drawer-link-main"><i data-lucide="calendar" style="width:18px;height:18px"></i> AI 플래너</span>
                    <i data-lucide="chevron-right" style="width:16px;height:16px" class="wayo-drawer-chev"></i>
                </a>
                <a href="insights.html" class="wayo-drawer-link">
                    <span class="wayo-drawer-link-main"><i data-lucide="sparkles" style="width:18px;height:18px"></i> 인사이트</span>
                    <i data-lucide="chevron-right" style="width:16px;height:16px" class="wayo-drawer-chev"></i>
                </a>
            </nav>

            <div class="wayo-drawer-label-row">
                <p class="wayo-drawer-label">최근 본 여행지</p>
                <div class="wayo-drawer-sort-wrap">
                    <button type="button" class="wayo-drawer-sort-btn" id="drawerSortBtn" aria-label="정렬 기준" aria-expanded="false">
                        <i data-lucide="sliders-horizontal" style="width:15px;height:15px"></i>
                    </button>
                    <div class="wayo-drawer-sort-menu" id="drawerSortMenu">
                        <p class="wayo-drawer-sort-title">정렬 기준</p>
                        <button type="button" class="wayo-drawer-sort-option is-active" data-sort="none">
                            없음 <i data-lucide="check" style="width:14px;height:14px" class="wayo-drawer-sort-check"></i>
                        </button>
                        <button type="button" class="wayo-drawer-sort-option" data-sort="name">
                            이름순 <i data-lucide="check" style="width:14px;height:14px" class="wayo-drawer-sort-check"></i>
                        </button>
                        <button type="button" class="wayo-drawer-sort-option" data-sort="country">
                            국가별 <i data-lucide="check" style="width:14px;height:14px" class="wayo-drawer-sort-check"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div id="drawerRecentList"></div>
        </div>

        <div class="wayo-drawer-foot">
            <button type="button" class="wayo-drawer-profile js-login-trigger" aria-label="로그인">
                <span class="wayo-drawer-avatar">W</span>
                <span class="wayo-drawer-profile-sub">로그인하여 맞춤 일정을 저장하세요</span>
            </button>
        </div>
    </aside>

    <!-- 회원가입 카드 -->
    <section class="auth-section">
        <div class="auth-card">
            <div class="auth-brand">
                <img src="assets/logo/w3_logo_3_2.png" alt="WAYO 로고">
                <p>WAYO와 함께 나만의 여행을 시작해보세요.</p>
            </div>

            <form class="auth-form" id="signupForm">
                <div class="form-field">
                    <label for="name">이름</label>
                    <input type="text" id="name" placeholder="이름을 입력하세요" required>
                </div>
                <div class="form-field">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-field">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="8자 이상 입력하세요" required>
                </div>
                <div class="form-field">
                    <label for="passwordConfirm">비밀번호 확인</label>
                    <input type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요" required>
                </div>
                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="termsAgree" style="width:auto;height:auto;" required>
                        <a href="#" data-coming-soon="이용약관 페이지를 준비하고 있어요!">이용약관</a> 및
                        <a href="#" data-coming-soon="개인정보처리방침 페이지를 준비하고 있어요!">개인정보처리방침</a>에 동의합니다
                    </label>
                </div>
                <button type="submit" class="auth-submit">회원가입</button>
            </form>

            <p class="login-modal-sns-label">또는</p>
            <div class="login-modal-sns-row">
                <button type="button" class="login-modal-sns-btn is-naver" data-provider="네이버" aria-label="네이버로 회원가입">
                    <span class="login-modal-sns-icon"><img src="assets/회원가입/naver.ico" alt="네이버"></span>
                    <span class="login-modal-sns-text">네이버</span>
                </button>
                <button type="button" class="login-modal-sns-btn is-kakao" data-provider="카카오" aria-label="카카오로 회원가입">
                    <span class="login-modal-sns-icon"><img src="assets/회원가입/kakao.png" alt="카카오"></span>
                    <span class="login-modal-sns-text">카카오</span>
                </button>
                <button type="button" class="login-modal-sns-btn is-google" data-provider="구글" aria-label="구글로 회원가입">
                    <span class="login-modal-sns-icon"><img src="assets/회원가입/google.png" alt="구글"></span>
                    <span class="login-modal-sns-text">구글</span>
                </button>
            </div>

            <p class="auth-foot">
                이미 계정이 있으신가요?
                <a href="login.html" class="js-login-trigger">로그인</a>
            </p>
        </div>
    </section>

    <div class="toast" id="toast"></div>

    <script src="js/destination-detail-data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
